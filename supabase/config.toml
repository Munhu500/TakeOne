project_id = "takeone"

[api]
port = 54321
schemas = ["public"]

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "takeone://"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false
otp_length = 6

[storage]
file_size_limit = "500MiB"
